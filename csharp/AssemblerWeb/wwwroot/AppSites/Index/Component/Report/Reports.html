<div style="background: white; padding: 24px; margin: 24px auto; max-width: 1400px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);">
    <h2 style="margin: 0 0 20px 0; color: #667eea; font-size: 1.8em; text-align: center;">
        {{$TitleIcon}} {{$Title}} - {{$Implementation}}
    </h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
        {{@Reports}}
            <button class="report-btn" onclick="openReportModal('{{$Id}}', '{{$FileName}}', '{{$UseLangPrefix}}', '{{$Title}}')">
                <div class="report-icon">{{$Icon}}</div>
                <div class="report-title">{{$Title}}</div>
                <div class="report-desc">{{$Description}}</div>
            </button>
        {{/Reports}}
    </div>
</div>

<!-- Report Modal -->
<div id="reportModal" class="modal">
    <div class="modal-content" style="max-width: 95%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;">
        <div class="modal-header">
            <h2 id="reportModalTitle">Report</h2>
            <button class="close" onclick="closeReportModal()">&times;</button>
        </div>
        <div class="modal-body" style="flex: 1; overflow-y: auto;">
            <div id="reportContent" style="max-width: 100%; overflow-x: auto;">
                Loading report...
            </div>
        </div>
    </div>
</div>

<style>
    .report-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        padding: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        text-align: center;
    }

    .report-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .report-btn:active {
        transform: translateY(-2px);
    }

    .report-icon {
        font-size: 3em;
        margin-bottom: 12px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .report-title {
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .report-desc {
        font-size: 0.9em;
        opacity: 0.9;
    }

    #reportContent table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0;
        font-size: 0.95em;
    }

    #reportContent th,
    #reportContent td {
        border: 1px solid #ddd;
        padding: 12px 8px;
        text-align: left;
    }

    #reportContent th {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    #reportContent tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    #reportContent tr:hover {
        background-color: #f0f0f0;
    }

    #reportContent h2 {
        color: #667eea;
        margin-top: 0;
    }

    #reportContent pre {
        background: #f4f4f4;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        border-left: 4px solid #667eea;
    }
</style>

<script>
    const LANG = '{{$Lang}}';
    const LOADING_MSG = '{{$LoadingMessage}}';
    const NOT_FOUND_MSG = '{{$NotFoundMessage}}';
    const ERROR_PREFIX = '{{$ErrorPrefix}}';

    function openReportModal(reportId, fileName, useLangPrefix, reportTitle) {
        const modal = document.getElementById('reportModal');
        const title = document.getElementById('reportModalTitle');
        const content = document.getElementById('reportContent');

        // Set modal title
        title.textContent = reportTitle;

        // Convert string 'true'/'True'/'false'/'False' to boolean (case-insensitive)
        const shouldUseLangPrefix = (typeof useLangPrefix === 'string')
            ? useLangPrefix.toLowerCase() === 'true'
            : useLangPrefix === true;

        // Construct file path
        const prefix = (shouldUseLangPrefix && LANG) ? LANG + '_' : '';
        const filePath = '/' + prefix + fileName;

        // Show modal with loading animation
        modal.style.display = 'block';
        content.innerHTML = '<div style="text-align: center; padding: 40px;"><div style="display: inline-block; width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite;"></div><p style="margin-top: 16px; color: #666;">' + LOADING_MSG + '</p></div>';

        // Fetch report
        fetch(filePath)
            .then(response => {
                if (!response.ok) throw new Error(NOT_FOUND_MSG);
                return response.text();
            })
            .then(html => {
                if (filePath.endsWith('.md')) {
                    // Simple markdown to HTML conversion for basic formatting
                    html = '<pre>' + html.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
                }
                content.innerHTML = html;
            })
            .catch(error => {
                content.innerHTML = '<div style="padding: 40px; text-align: center; color: #d32f2f;"><h3>⚠️ ' + error.message + '</h3><p style="font-size: 0.9em; color: #666;">' + ERROR_PREFIX + ' ' + filePath + '</p></div>';
            });
    }

    function closeReportModal() {
        document.getElementById('reportModal').style.display = 'none';
    }

    // Close on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeReportModal();
        }
    });

    // Close on outside click
    window.addEventListener('click', function(e) {
        const modal = document.getElementById('reportModal');
        if (e.target === modal) {
            closeReportModal();
        }
    });

    // Animation for loading spinner
    const style = document.createElement('style');
    style.textContent = `
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    `;
    document.head.appendChild(style);
</script>
