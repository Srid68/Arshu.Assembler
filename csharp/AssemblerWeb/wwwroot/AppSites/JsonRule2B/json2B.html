<div style="max-width: 800px; margin: 40px auto; padding: 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);">
    <div style="background: white; padding: 30px; border-radius: 8px;">
        <h2 style="color: #667eea; margin: 0 0 10px 0; font-size: 1.8em;">Rule 5: JSON Array Assembly (Multiple Arrays)</h2>
        <p style="color: #666; margin: 0 0 25px 0; font-size: 0.95em;">Multiple JSON array iterations in single component</p>

        <div style="background: #f8f9fa; padding: 20px; border-radius: 6px; border-left: 4px solid #667eea; margin-bottom: 20px;">
            <div style="color: #495057; font-size: 0.9em; margin-bottom: 15px;">
                <strong>📝 Array 1:</strong> <code style="background: white; padding: 2px 8px; border-radius: 3px;">&#123;&#123;@Json2BArrayKey&#125;&#125;</code>
            </div>
            <div>
                <select>
                    {{@Json2BArrayKey}}
                    <div style="border: 2px dashed #4caf50; border-radius: 6px; padding: 10px; background: #f1f8f4; margin: 5px 0;">
                        <p style="margin: 0 0 5px 0; text-align: center; color: #4caf50; font-weight: 500; font-size: 0.85em;">🔁 Array 1 Item Content</p>
                        <option {{@Selected}}selected="selected" {{ /Selected}} value="{{$Value}}">{{$Name}}</option>
                    </div>
                    {{/Json2BArrayKey}}
                    {{^Json2BArrayKey}}
                    <option value="0">No Data Found</option>
                    {{/Json2BArrayKey}}
                </select>
            </div>
        </div>

        <div style="background: #f8f9fa; padding: 20px; border-radius: 6px; border-left: 4px solid #667eea;">
            <div style="color: #495057; font-size: 0.9em; margin-bottom: 15px;">
                <strong>📝 Array 2 (Empty):</strong> <code style="background: white; padding: 2px 8px; border-radius: 3px;">&#123;&#123;@anotherJson2BArrayKey&#125;&#125;</code>
            </div>
            <div>
                <select>
                    {{@anotherJson2BArrayKey}}
                    <div style="border: 2px dashed #4caf50; border-radius: 6px; padding: 10px; background: #f1f8f4; margin: 5px 0;">
                        <p style="margin: 0 0 5px 0; text-align: center; color: #4caf50; font-weight: 500; font-size: 0.85em;">🔁 Array 2 Item Content</p>
                        <option {{@Selected}}selected="selected" {{ /Selected}} value="{{$Value}}">{{$Name}}</option>
                    </div>
                    {{/anotherJson2BArrayKey}}
                    {{^anotherJson2BArrayKey}}
                    <option value="0">No Another Data Found</option>
                    {{/anotherJson2BArrayKey}}
                </select>
            </div>
        </div>
    </div>
</div>
