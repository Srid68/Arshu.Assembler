<div style="max-width: 800px; margin: 40px auto; padding: 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);">
    <div style="background: white; padding: 30px; border-radius: 8px;">
        <h2 style="color: #667eea; margin: 0 0 10px 0; font-size: 1.8em;">Rule 5: JSON Bool Assembly</h2>

                <select>

            </div>
        </div>
    </div>
