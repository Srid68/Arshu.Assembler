<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="google" content="notranslate">
    <meta name="description" content="Arshu Polyglot Web Assembler - {{$Implementation}} implementation for template merging and rendering with comparison between Normal Engine and PreProcess Engine">
    <meta property="og:title" content="Arshu Polyglot {{$Title}}">
    <meta property="og:description" content="A powerful template engine that merges HTML components with JSON data. Compare Normal Engine and PreProcess Engine side by side.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Arshu Polyglot {{$Title}}">
    <meta name="twitter:description" content="A powerful template engine that merges HTML components with JSON data.">
    <meta name="theme-color" content="#667eea">
    <title>Arshu Polyglot {{$Title}}</title>
    <script src="/Resource/js/logger.js"></script>
    <script>
        // Enable debug logging
        if (typeof Logger !== 'undefined') {
            Logger.configure(Logger.LogLevel.DEBUG, true);
            console.log('Logger configured: DEBUG level with console output enabled');
        }
    </script>
    <!-- Client-side assembly engines and utilities -->
    <script src="/Resource/js/normalEngine.js"></script>
    <script src="/Resource/js/preprocessEngine.js"></script>
    <script src="/Resource/js/assembler.js"></script>
    <style>
        /* Global Reset & Base Styles */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
        }

        /* Theme Colors & Typography */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --white: #ffffff;
            --white-transparent-10: rgba(255,255,255,0.1);
            --white-transparent-20: rgba(255,255,255,0.2);
            --white-transparent-30: rgba(255,255,255,0.3);
            --white-transparent-95: rgba(255,255,255,0.95);
            --white-transparent-98: rgba(255,255,255,0.98);
            --black-transparent-20: rgba(0,0,0,0.2);
            --black-transparent-50: rgba(0,0,0,0.5);
            --gray-light: #f5f7fa;
            --gray: #666;
            --gray-dark: #333;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0,0,0,0.15);
            --error-color: #d32f2f;
            --error-bg: #ffebee;
            --gold: #ffd700;
            --magenta: #d63384;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--black-transparent-50);
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .modal-header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .modal-header h2 {
                margin: 0;
                font-size: 1.5em;
            }

        .close {
            color: white;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
            transition: transform 0.2s;
        }

            .close:hover {
                transform: scale(1.2);
            }

        .modal-body {
            padding: 24px;
            line-height: 1.6;
        }

            .modal-body h3 {
                color: var(--primary-color);
                margin-top: 24px;
                margin-bottom: 12px;
            }

                .modal-body h3:first-child {
                    margin-top: 0;
                }

            .modal-body code {
                background: #f4f4f4;
                padding: 2px 6px;
                border-radius: 3px;
                color: var(--magenta);
                font-size: 0.9em;
            }

            .modal-body ul {
                padding-left: 24px;
            }

            .modal-body li {
                margin-bottom: 8px;
            }

        @media (max-width: 768px) {
            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
        }
    </style>
</head>
<body>
    {{MainHeader}}

    {{MainContent}}

</body>
</html>
