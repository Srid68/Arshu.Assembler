<style>
.content {
    display: flex;
    gap: 20px;
    padding: 20px;
    min-height: calc(100vh - 220px);
}

.column {
    flex: 1;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.column-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 16px 20px;
}

.column-header h2 {
    margin: 0;
    font-size: 1.3em;
    font-weight: 600;
    text-align: center;
}

.timing-bar {
    text-align: center;
    font-size: 0.85em;
    margin-top: 8px;
    color: rgba(255,255,255,0.95);
    font-weight: 500;
}

.timing-bar b {
    color: #fff;
    background: rgba(0,0,0,0.2);
    padding: 2px 6px;
    border-radius: 4px;
}

.column-content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.result-content {
    border: 2px solid #e0e0e0;
    padding: 16px;
    min-height: 300px;
    background: #fafafa;
    border-radius: 8px;
}

.template-details {
    display: none;
}

.template-details.show {
    display: block;
}

@media (max-width: 768px) {
    .content {
        flex-direction: column;
        padding: 10px;
    }

    .column {
        min-height: 400px;
    }

    .timing-bar {

        line-height: 1.4;
