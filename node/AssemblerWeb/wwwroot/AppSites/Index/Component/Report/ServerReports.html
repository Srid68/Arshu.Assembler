<div style="background: white; padding: 24px; margin: 24px auto; max-width: 1400px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);">
    <h2 style="margin: 0 0 20px 0; color: #667eea; font-size: 1.8em; text-align: center;">
        {{$TitleIcon}} {{$Title}} - {{$Implementation}}
    </h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
        {{@Reports}}
            <div class="report-card">
                <button class="report-btn" onclick="openReportModal('{{$Id}}', '{{$FileName}}', '{{$UseLangPrefix}}', '{{$Title}}')">
                    <div class="report-icon">{{$Icon}}</div>
                    <div class="report-title">{{$Title}}</div>
                    <div class="report-desc">{{$Description}}</div>
                </button>
                <button class="test-trigger-btn" onclick="triggerTest('{{$Id}}')">
                    ▶️ {{$ButtonText}}
                </button>
            </div>
        {{/Reports}}
    </div>

    <!-- Notification bar -->
    <div id="testNotification" class="test-notification" style="display: none;">
        <span id="notificationText"></span>
        <button id="clearNotification" class="clear-notification-btn" onclick="hideNotification()" style="display: none;">✕</button>
    </div>
</div>

<!-- Report Modal -->
<div id="reportModal" class="modal">
    <div class="modal-content" style="max-width: 95%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;">
        <div class="modal-header">
            <h2 id="reportModalTitle">Report</h2>
            <button class="close" onclick="closeReportModal()">&times;</button>
        </div>
        <div class="modal-body" style="flex: 1; overflow-y: auto;">
            <div id="reportContent" style="max-width: 100%; overflow-x: auto;">
                Loading report...
            </div>
        </div>
    </div>
</div>

<style>
    .report-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .report-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        padding: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        text-align: center;
        flex: 1;
    }

    .report-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .report-btn:active {
        transform: translateY(-2px);
    }

    .test-trigger-btn {
        background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
        box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
        text-align: center;
        font-weight: bold;
        font-size: 0.95em;
    }

    .test-trigger-btn:hover {
        background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
    }

    .test-trigger-btn:active {
        transform: translateY(0);
    }

    .test-notification {
        margin-top: 16px;
        padding: 16px 24px;
        border-radius: 8px;
        text-align: left;
        font-weight: 500;
        font-size: 1em;
        animation: slideIn 0.3s ease-out;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        position: relative;
    }

    #notificationText {
        flex: 1;
        white-space: pre-line;
    }

    .clear-notification-btn {
        background: rgba(0, 0, 0, 0.1);
        border: none;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .clear-notification-btn:hover {
        background: rgba(0, 0, 0, 0.2);
        transform: scale(1.1);
    }

    .test-notification.success {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
        border: 1px solid #c3e6cb;
    }

    .test-notification.error {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
        border: 1px solid #f5c6cb;
    }

    .test-notification.running {
        background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
        color: #0c5460;
        border: 1px solid #bee5eb;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .report-icon {
        font-size: 3em;
        margin-bottom: 12px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .report-title {
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .report-desc {
        font-size: 0.9em;
        opacity: 0.9;
    }

    #reportContent table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0;
        font-size: 0.95em;
    }

    #reportContent th,
    #reportContent td {
        border: 1px solid #ddd;
        padding: 12px 8px;
        text-align: left;
    }

    #reportContent th {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    #reportContent tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    #reportContent tr:hover {
        background-color: #f0f0f0;
    }

    #reportContent h2 {
        color: #667eea;
        margin-top: 0;
    }

    #reportContent pre {
        background: #f4f4f4;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        border-left: 4px solid #667eea;
    }
</style>

<script>
    const LANG = '{{$Lang}}';
    const LOADING_MSG = '{{$LoadingMessage}}';
    const NOT_FOUND_MSG = '{{$NotFoundMessage}}';
    const ERROR_PREFIX = '{{$ErrorPrefix}}';

    function openReportModal(reportId, fileName, useLangPrefix, reportTitle) {
        const modal = document.getElementById('reportModal');
        const title = document.getElementById('reportModalTitle');
        const content = document.getElementById('reportContent');

        // Set modal title
        title.textContent = reportTitle;

        // Convert string 'true'/'True'/'false'/'False' to boolean (case-insensitive)
        const shouldUseLangPrefix = (typeof useLangPrefix === 'string')
            ? useLangPrefix.toLowerCase() === 'true'
            : useLangPrefix === true;

        // Show modal with loading animation
        modal.style.display = 'block';
        content.innerHTML = '<div style="text-align: center; padding: 40px;"><div style="display: inline-block; width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite;"></div><p style="margin-top: 16px; color: #666;">' + LOADING_MSG + '</p></div>';

        // Fetch report using POST request
        fetch('/api/report', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                fileName: fileName,
                useLangPrefix: shouldUseLangPrefix
            })
        })
            .then(response => {
                if (!response.ok) throw new Error(NOT_FOUND_MSG);
                return response.text();
            })
            .then(html => {
                if (fileName.endsWith('.md')) {
                    // Simple markdown to HTML conversion for basic formatting
                    html = '<pre>' + html.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
                }
                content.innerHTML = html;
            })
            .catch(error => {
                content.innerHTML = '<div style="padding: 40px; text-align: center; color: #d32f2f;"><h3>⚠️ ' + error.message + '</h3><p style="font-size: 0.9em; color: #666;">' + ERROR_PREFIX + ' ' + fileName + '</p></div>';
            });
    }

    function closeReportModal() {
        document.getElementById('reportModal').style.display = 'none';
    }

    // Close on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeReportModal();
        }
    });

    // Close on outside click
    window.addEventListener('click', function(e) {
        const modal = document.getElementById('reportModal');
        if (e.target === modal) {
            closeReportModal();
        }
    });

    // Animation for loading spinner
    const style = document.createElement('style');
    style.textContent = `
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    `;
    document.head.appendChild(style);

    function showNotification(message, type) {
        const notification = document.getElementById('testNotification');
        const notificationText = document.getElementById('notificationText');
        const clearBtn = document.getElementById('clearNotification');

        // Clear existing classes
        notification.className = 'test-notification';
        notification.classList.add(type);

        notificationText.textContent = message;
        notification.style.display = 'flex';

        // Show clear button only for success and error messages (not for running)
        if (type === 'success' || type === 'error') {
            clearBtn.style.display = 'flex';
        } else {
            clearBtn.style.display = 'none';
        }
    }

    function hideNotification() {
        const notification = document.getElementById('testNotification');
        const clearBtn = document.getElementById('clearNotification');
        notification.style.display = 'none';
        clearBtn.style.display = 'none';
    }

    async function triggerTest(testId) {
        const button = event.target;
        const originalText = button.textContent;

        // Clear any existing notification
        hideNotification();

        // Disable button and show loading state
        button.disabled = true;
        button.textContent = '⏳ Running...';
        button.style.opacity = '0.6';

        // Show running notification
        showNotification('🔄 Test is running, please wait...', 'running');

        try {
            let endpoint = '';
            let testName = '';
            switch(testId) {
                case 'standardTest':
                    endpoint = '/test/standard';
                    testName = 'Standard Tests';
                    break;
                case 'advancedTest':
                    endpoint = '/test/advanced';
                    testName = 'Advanced Tests';
                    break;
                case 'perfSummary':
                    endpoint = '/test/performance';
                    testName = 'Performance Tests';
                    break;
                case 'allPerfTests':
                    endpoint = '/test/consolidate-performance';
                    testName = 'Consolidated Performance Tests';
                    break;
                default:
                    showNotification('❌ Unknown test type: ' + testId, 'error');
                    return;
            }

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();

            // Show success notification (stays visible until user clears it)
            showNotification(`✅ ${result.message}`, 'success');

            // Don't auto-hide or reload - let user manually clear and refresh if needed

        } catch (error) {
            showNotification('❌ Error running test: ' + error.message, 'error');
            console.error('Test error:', error);
        } finally {
            // Re-enable button
            button.disabled = false;
            button.textContent = originalText;
            button.style.opacity = '1';
        }
    }
</script>
