<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="google" content="notranslate">
    <meta name="description" content="OCI Server Home - {{$Implementation}}">
    <meta property="og:title" content="OCI Server - {{$Implementation}}">
    <meta property="og:description" content="Polyglot OCI Registry Server">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OCI Server">
    <meta name="twitter:description" content="Polyglot OCI Registry Server">
    <meta name="theme-color" content="#667eea">
    <title>Arshu Polyglot {{$Title}}</title>

    <!-- Client-side assembly engines, logger, and utilities -->
    <script src="/Resource/js/logger.js"></script>
    <script src="/Resource/js/normalEngine.js"></script>
    <script src="/Resource/js/preprocessEngine.js"></script>
    <script src="/Resource/js/assembler.js"></script>

    <style>
        /* Global Reset & Base Styles */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Theme Colors */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }

        /* Main content container */
        .home-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .home-content {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .home-title {
            font-size: 2.5em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .home-description {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Options container */
        .options-container {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .option-group {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .option-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .radio-option label {
            cursor: pointer;
            color: #666;
            font-size: 0.95em;
        }

        .show-metrics-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .show-metrics-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .show-metrics-btn:active {
            transform: translateY(0);
        }

        .show-metrics-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading spinner */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .show-metrics-btn.loading .btn-text {
            display: none;
        }

        .show-metrics-btn.loading .loading-spinner {
            display: block;
        }
    </style>
</head>
<body>
    {{MainHeader}}

</body>
</html>
