[package]
name = "arshu"
version = "1.0.0"
edition = "2021"
authors = ["Sridharan Srinivasan <srid68@gmail.com>"]
description = "Core shared library providing Logger and common utilities for all Arshu Rust projects"
license = "MIT"
homepage = "https://github.com/Srid68/Arshu.Assembler"
repository = "https://github.com/Srid68/Arshu.Assembler"
keywords = ["logging", "utilities", "polyglot", "arshu"]

[lib]
name = "arshu"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
lazy_static = "1.4"
