[package]
name = "arshu-assembler"
version = "1.0.0"
edition = "2021"
authors = ["Sridharan Srinivasan <srid68@gmail.com>"]
description = "Template assembly engine for dynamic HTML generation with normal and preprocess modes"
license = "MIT"
repository = "https://github.com/Srid68/Arshu.Assembler"
homepage = "https://github.com/Srid68/Arshu.Assembler"
keywords = ["template", "assembler", "html", "engine", "preprocess"]
categories = ["template-engine", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.5.0"
lazy_static = "1.4"
chrono = "0.4"
once_cell = "1.19"
indexmap = { version = "2.0", features = ["serde"] }
